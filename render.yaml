services:
  - type: web
    name: senus-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    # Must match senus-db's region (frankfurt) - Render's internal hostnames only
    # resolve between services in the same region.
    region: frankfurt
    envVars:
      # senus-db already exists as a standalone Postgres instance (provisioned
      # separately, not Blueprint-managed) - fromDatabase only works for databases
      # a Blueprint creates itself, so this is set manually instead.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
